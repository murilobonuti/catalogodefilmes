<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="Catálogo de Filmes. Construída com HTML, CSS e JavaScript puro." />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Catálogo de Filmes</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <header>
            <h1 class="inicio">Catálogo de Filmes</h1>
            <p>Explore os filmes em cartaz e favoritos.</p>
        </header>

        <input type="text" id="pesquisa" placeholder="Pesquisar filme...">
        <button id="btn-pesquisar">Pesquisar</button>

        <select id="categoria">
            <option value="Todas">Todas</option>
            <option value="Ação">Ação</option>
            <option value="Terror">Terror</option>
            <option value="Animação">Animação</option>
            <option value="Ficção">Ficção</option>
        </select>
        <form id="form-cadastro" novalidate>

            <h2>Cadastrar novo filme</h2>

            <input
                type="text"
                id="nome-filme"
                placeholder="Nome do filme"
            >

            <input
                type="number"
                id="duracao-filme"
                placeholder="Duração em minutos"
            >
            <textarea
                id="descricao-filme"
                placeholder="Descrição do filme"
                rows="4"
            ></textarea>
            <select id="categoria-filme">
                <option value="">Selecione uma categoria</option>
                <option value="Ação">Ação</option>
                <option value="Terror">Terror</option>
                <option value="Animação">Animação</option>
                <option value="Ficção">Ficção</option>
            </select>

            <button type="submit">Cadastrar filme</button>

            <p id="mensagem"></p>

        </form>

        <p id="painel-q06"></p>

        <main id="lista">
        </main>

        <script src="js/script.js"></script>
    </body>

</html>
